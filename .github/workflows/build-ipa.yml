name: Build unsigned IPA

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    # XcodeGen 2.45 emits objectVersion 77, which needs Xcode 16 or newer.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: ./Scripts/build_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DAWLearn-unsigned-ipa
          path: build/DAWLearn-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
